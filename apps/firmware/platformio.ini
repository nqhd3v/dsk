; dsk-guard ESP32-S3 firmware
; Target: MKE-K01 (ESP32-S3-WROOM-1 N16R8)
;   - 16 MB Flash
;   - 8 MB OPI PSRAM
;   - CH343P USB-UART (NOT native USB CDC)
;   - On-board RGB on GPIO 48
; Docs: ../../docs/system/README.md

[platformio]
default_envs = main

[env:main]
platform        = espressif32@^6.7.0
board           = esp32-s3-devkitc-1
framework       = arduino

; --- Flash + PSRAM (N16R8) ---
board_build.flash_size           = 16MB
board_upload.flash_size          = 16MB
board_upload.maximum_size        = 16777216
board_build.partitions           = default_16MB.csv
board_build.arduino.memory_type  = qio_opi
board_build.psram_type           = opi

; --- Serial via CH343P (UART0 bridge) — do NOT enable native USB CDC ---
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder, time

; --- Compile flags ---
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DDG_FW_VERSION=\"0.0.1\"

; --- Libraries (Phase 0: RGB smoke test only) ---
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.3

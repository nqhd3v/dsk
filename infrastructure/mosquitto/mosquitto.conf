# dsk-guard Mosquitto config
# Docs: https://mosquitto.org/man/mosquitto-conf-5.html

# ── Listeners ─────────────────────────────────────────────────
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ── Authentication ────────────────────────────────────────────
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ── Persistence ───────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
